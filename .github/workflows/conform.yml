# Copy to .github/workflows/conform.yml in your repo.
name: conform
on: [push]
jobs:
  conform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install && bash install --dir "$HOME/.local/bin" --version 1.12.217
      # Project A only: Python and the libraries we run.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - run: bb conform
